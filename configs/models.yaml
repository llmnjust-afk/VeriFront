# Model registry. API keys come ONLY from environment variables (never here).
frontier:
  provider: ChatAnywhere relay (OpenAI-compatible; user-provided key)
  model_id: gpt-5.5-2026-04-23     # dated snapshot, newest dated GPT-5.5 on relay (2026-10-09)
  snapshot: gpt-5.5-2026-04-23
  snapshot_fallback: gpt-5.2-2025-12-11
  base_url: https://api.chatanywhere.org/v1   # overseas lab line; domestic alt: https://api.chatanywhere.tech/v1
  base_url_env: FRONTIER_BASE_URL
  api_key_env: FRONTIER_API_KEY
  smoke_verified: "2026-10-09 gpt-4o-mini-2024-07-18 returned OK (13 tokens)"
  price_per_1m_usd:
    prompt: null                   # TBD: relay billing may differ from official; record from real usage
    completion: null
local:
  - name: local-a
    family: qwen3                 # newest permissive 7-8B class (2026-10-09 HF survey)
    model_id: Qwen/Qwen3-8B
    hf_revision: b968826d9c46dd6066d109eabc6255188de91218   # main @ 2025-07-26
    precision: bf16
    quantization: none         # bf16 preferred: quantization would confound ΔSR attribution
    endpoint: http://127.0.0.1:8001/v1
    api_key_env: null          # local vLLM typically needs none
  - name: local-b
    family: llama              # placeholder family; prefer cross-family vs local-a
    model_id: null             # P0 TODO: e.g. Llama-3.1-8B-Instruct
    hf_revision: null
    precision: bf16
    quantization: none
    endpoint: http://127.0.0.1:8002/v1
    api_key_env: null
continuation:
  policy: frontier             # P3 default: commercial frontier continues after the replaced step
  open_weight_subexperiment: false  # if enabled later, MUST be reported as a separate labeled condition
constraints:
  # 24GB card: 7-8B bf16 weights ~14-16GB; KV cache at 32k ctx ~3-4GB => keep concurrency=1
  local_max_context_tokens: 32768
  local_max_concurrency: 1
  notes: >
    14B bf16 (~28GB) does NOT fit a single 24GB card; int4 fits but changes capability
    (quantization confound) — on-site stress test required before any 14B use.
